<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор случайных чисел онлайн</title>
    <meta name="description" content="Простой генератор случайных чисел в заданном диапазоне. Выберите минимальное и максимальное значение, получите случайное число от 0 до 100 000.">
    <meta name="keywords" content="генератор случайных чисел, рандомное число, генератор чисел онлайн, random number generator">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: purple;
        }
        h1 {
            margin-bottom: 40px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        #result {
            font-size: 24px;
            margin-top: 20px;
            color: #0066cc;
            background-color: yellow;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            min-width: 200px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: -5px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Генератор случайных чисел</h1>

    <div class="input-group">
        <label>Минимальное число: </label>
        <input type="number" id="min" value="1" max="100000" min="0">
        <div id="error-min-limit" class="error">Минимальное число не может превышать 100 000!</div>
        <div id="error-min-negative" class="error">Минимальное число не может быть отрицательным!</div>

        <label>Максимальное число: </label>
        <input type="number" id="max" value="100" max="100000" min="0">
        <div id="error-max-limit" class="error">Максимальное число не может превышать 100 000!</div>
        <div id="error-max-negative" class="error">Максимальное число не может быть отрицательным!</div>
        
        <div id="error-order" class="error">Минимальное число не может быть больше максимального!</div>
    </div>

    <button onclick="generateRandom()">Сгенерировать число!</button>

    <div id="result">Здесь появится результат</div>

    <script>
        function generateRandom() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            const errorMinLimit = document.getElementById('error-min-limit');
            const errorMinNegative = document.getElementById('error-min-negative');
            const errorMaxLimit = document.getElementById('error-max-limit');
            const errorMaxNegative = document.getElementById('error-max-negative');
            const errorOrder = document.getElementById('error-order');

            errorMinLimit.style.display = 'none';
            errorMinNegative.style.display = 'none';
            errorMaxLimit.style.display = 'none';
            errorMaxNegative.style.display = 'none';
            errorOrder.style.display = 'none';

            let hasError = false;

            if (min > 100000) {
                errorMinLimit.style.display = 'block';
                hasError = true;
            }
            if (min < 0) {
                errorMinNegative.style.display = 'block';
                hasError = true;
            }
            if (max > 100000) {
                errorMaxLimit.style.display = 'block';
                hasError = true;
            }
            if (max < 0) {
                errorMaxNegative.style.display = 'block';
                hasError = true;
            }
            if (min > max) {
                errorOrder.style.display = 'block';
                hasError = true;
            }

            if (hasError) return;

            const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('result').textContent = `Случайное число: ${randomNum}`;
        }

        document.getElementById('min').addEventListener('input', function() {
            const minValue = parseInt(this.value);
            const errorMessageMinLimit = document.getElementById('error-min-limit');
            const errorMessageMinNegative = document.getElementById('error-min-negative');
            const errorMessageOrder = document.getElementById('error-order');
            const maxValue = parseInt(document.getElementById('max').value);

            if (minValue > 100000) errorMessageMinLimit.style.display = 'block'; else errorMessageMinLimit.style.display = 'none';
            if (minValue < 0) errorMessageMinNegative.style.display = 'block'; else errorMessageMinNegative.style.display = 'none';
            if (minValue > maxValue) errorMessageOrder.style.display = 'block'; else errorMessageOrder.style.display = 'none';
        });


        document.getElementById('max').addEventListener('input', function() {
            const maxValue = parseInt(this.value);
            const errorMessageMaxLimit = document.getElementById('error-max-limit');
            const errorMessageMaxNegative = document.getElementById('error-max-negative');
            const errorMessageOrder = document.getElementById('error-order');
            const minValue = parseInt(document.getElementById('min').value);

            if (maxValue > 100000) errorMessageMaxLimit.style.display = 'block'; else errorMessageMaxLimit.style.display = 'none';
            if (maxValue < 0) errorMessageMaxNegative.style.display = 'block'; else errorMessageMaxNegative.style.display = 'none';
            if (minValue > maxValue) errorMessageOrder.style.display = 'block'; else errorMessageOrder.style.display = 'none';
        });
    </script>
</body>
</html>
